<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
    US-056: the app's own launcher icon, redrawn for the Night Panel (1.1.0).
    A three-spoke steering wheel: the one object everybody reads as "car"
    at 40 px, and an original drawing, NOT the Škoda winged-arrow logo and no
    Škoda typeface (docs/decisions.md, "Branding": no trademark licence
    exists for either).

    Colours: the owner's decision of 2026-10-07 makes Škoda Electric Green
    the app's single accent (docs/decisions.md, "Branding"). Both colours sit
    exactly on the 64-colour grid of the memory-in-pixel panel, so
    dithering="none" in drawables.xml keeps them as drawn:
      #55FFAA  Electric Green, Škoda's #78FAAE shown as #55FFAA on the
               panel: rim and spokes
      #005555  Emerald, Škoda's #0E3A2F shown as #005555 on the panel: the
               hub's face
    Emerald on its own all but vanishes on the system's black, which is why
    the hub carries a green edge.

    No background shape: the icon is transparent and sits on the black the
    system draws behind the app list and the glance list. The rim's outer
    edge stops 2 px inside the 40 px square so a circular crop never clips
    it. Bold shapes only, nothing thinner than 3 px, no gradients: fine
    detail and subtle hues both disappear on this panel
    (docs/best-practices/garmin-connect-iq.md, "Publishing to the Connect IQ
    Store").
-->

<!-- Rim: outer edge at r 18, inner edge at r 13. -->
<circle cx="20" cy="20" r="15.5" stroke="#55FFAA" stroke-width="5" fill="none"/>

<!-- Spokes, slightly wider where they meet the hub, so the three read as
     one moulded piece rather than three sticks. -->
<path d="M6 18.25 L14.5 17 L14.5 23 L6 21.75 Z" fill="#55FFAA"/>
<path d="M34 18.25 L25.5 17 L25.5 23 L34 21.75 Z" fill="#55FFAA"/>
<path d="M17.75 34 L22.25 34 L23.25 25.5 L16.75 25.5 Z" fill="#55FFAA"/>

<!-- Hub: Emerald face, 3 px green edge (outer radius 6). -->
<circle cx="20" cy="20" r="4.5" fill="#005555" stroke="#55FFAA" stroke-width="3"/>
</svg>
